<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BUN & DOUGH - Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // If not already in dist or docs, redirect to dist
        if (window.location.hostname.endsWith('github.io')) {
          if (!path.includes('/dist') && !path.includes('/docs')) {
            var segments = path.split('/').filter(Boolean);
            var repo = segments.length > 0 ? '/' + segments[0] : '';
            window.location.replace(repo + '/dist/' + search + hash);
            return;
          }
        }
        window.location.replace('./');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to BUN & DOUGH...</p>
  </body>
</html>
